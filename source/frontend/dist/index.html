<!doctype html>
<html lang="zh-CN" data-theme="dark" data-motion="on" data-startup="loading">
<head>
 <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
 <meta name="color-scheme" content="dark light"><title>嘉豪工具箱 v4.4.0</title>
 <link rel="icon" type="image/svg+xml" href="/assets/assets/logo.svg">
 <style>/* Critical startup styles are inlined into the generated HTML before first paint. */
html{background:#081321;color:#f2f6ff}html[data-theme=light]{background:#edf2f9;color:#192b43}body{margin:0}#startup{position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#081321;color:#f2f6ff;font-family:'Segoe UI','Microsoft YaHei',sans-serif;opacity:1;transition:opacity .32s cubic-bezier(.22,1,.36,1)}#startup::before{content:'';position:absolute;width:min(480px,85vw);height:300px;background:radial-gradient(ellipse,#1677f219,transparent 65%);pointer-events:none;animation:startup-background .2s ease-out both}.startup-brand{display:flex;align-items:center;gap:24px;position:relative}.startup-logo{width:76px;height:84px;animation:startup-logo .32s .12s cubic-bezier(.22,1,.36,1) both}.startup-copy{animation:startup-copy .38s .36s cubic-bezier(.22,1,.36,1) both}.startup-copy h1{font-size:clamp(24px,3vw,34px);font-weight:650;letter-spacing:1px;margin:0}.startup-copy p{font-size:11px;letter-spacing:3.6px;margin:9px 0 10px;color:#9eafc7}.startup-copy small{font-size:12px;color:#7895b7}.startup-loading{width:190px;margin-top:35px;animation:startup-copy .25s .7s ease-out both}.startup-track{height:2px;overflow:hidden;background:#18324c;border-radius:2px}.startup-track span{display:block;width:35%;height:100%;background:#228eff;animation:startup-indeterminate 1.2s ease-in-out infinite;will-change:transform}#startup-status{width:min(460px,86vw);min-height:40px;margin:17px 0 0;font-size:12px;line-height:1.7;text-align:center;color:#9eafc7}#startup-retry{border:1px solid #3677af;color:inherit;background:transparent;border-radius:6px;padding:8px 18px;cursor:pointer}#startup-retry[hidden]{display:none}.startup-error .startup-track span{animation:none;background:#ee9c72;transform:none;width:100%}.startup-error .startup-logo,.startup-error .startup-copy,.startup-error .startup-loading{animation:none}.startup-leaving{pointer-events:none}#startup.startup-leaving{opacity:0}html[data-startup=loading] #app{opacity:0;pointer-events:none}html[data-startup=ready] #app{animation:startup-dashboard .32s cubic-bezier(.22,1,.36,1) both}html[data-startup=error] #app{visibility:hidden}html[data-theme=light] #startup{background:#edf2f9;color:#192b43}html[data-theme=light] .startup-copy p,html[data-theme=light] #startup-status{color:#576b85}html[data-theme=light] .startup-track{background:#d4e0ef}html[data-motion=off] #startup *,html[data-motion=off] #startup::before,html[data-motion=off][data-startup=ready] #app{animation:none!important}html[data-motion=off] #startup{transition:none}html[data-motion=off] .startup-track span{transform:translateX(90%)}@keyframes startup-background{from{opacity:0}to{opacity:1}}@keyframes startup-logo{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}@keyframes startup-copy{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}@keyframes startup-indeterminate{from{transform:translateX(-110%)}to{transform:translateX(390%)}}@keyframes startup-dashboard{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){#startup *,#startup::before,html[data-startup=ready] #app{animation:none!important}#startup{transition:none}.startup-track span{transform:translateX(90%)}}@media(max-width:500px){.startup-brand{gap:16px}.startup-logo{width:58px;height:64px}.startup-copy p{font-size:9px;letter-spacing:2px}}
</style>
 <link rel="stylesheet" href="/assets/styles/app.css">
</head>
<body>
 <section id="startup" role="status" aria-label="嘉豪工具箱正在启动" aria-busy="true"><div class="startup-brand"><img class="startup-logo" src="/assets/assets/logo.svg" alt="" width="76" height="84"><div class="startup-copy"><h1>嘉豪工具箱</h1><p>JIAHAO TOOLBOX</p><small>v4.4.0</small></div></div><div class="startup-loading"><div class="startup-track" aria-hidden="true"><span></span></div></div><p id="startup-status">正在加载界面…</p><button id="startup-retry" hidden>重新加载</button></section>
 <script src="/assets/startup.js"></script>
 <div id="app"><div class="boot"><img src="/assets/assets/logo.svg" width="56" height="56" alt="嘉豪工具箱"><h1>嘉豪工具箱</h1><p>正在连接本地监控服务…</p><p class="muted">全部核心数据在本机处理</p></div></div>
 <div id="toasts" role="status" aria-live="polite"></div>
 <dialog id="modal" aria-labelledby="modal-title"><div id="modal-body"></div></dialog>
 <noscript>请启用 WebView2 的 JavaScript，以使用本地工具箱界面。</noscript>
</body></html>
